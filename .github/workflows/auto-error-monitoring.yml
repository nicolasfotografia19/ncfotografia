name: "Auto Monitor & Self-Healing Pipeline"

on:
  schedule:
    # Chequeo preventivo programado todos los días a las 08:00 UTC
    - cron: '0 8 * * *'
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  healthcheck-and-diagnose:
    name: "Verificar APIs y Auto-Diagnosticar"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de prueba
        run: |
          npm install --no-audit --no-fund

      - name: Probar Endpoints de Producción (Curator.io, Apps Script, Formspree)
        id: api_check
        run: |
          node test-api.cjs || echo "API_FAILED=true" >> $GITHUB_ENV

      - name: Probar Integridad del DOM y Visores
        id: dom_check
        run: |
          node test-dom.cjs || echo "DOM_FAILED=true" >> $GITHUB_ENV

      - name: Auto-Reporte y Creación de Issue si se detecta falla
        if: env.API_FAILED == 'true' || env.DOM_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 [Auto-Diagnóstico] Falla detectada en servicios externos o DOM";
            const body = `### Reporte Automático de Errores

Se detectó una inconsistencia durante el chequeo programado de producción:
- **API Status**: ${process.env.API_FAILED ? '❌ Fallo de conexión o respuesta' : '✅ Saludable'}
- **DOM Status**: ${process.env.DOM_FAILED ? '❌ Fallo en la renderización' : '✅ Saludable'}

Este issue fue etiquetado automáticamente con \`fix-me\` para activar el bot de resolución automática.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'fix-me']
            });

  auto-resolve-issue:
    name: "Auto-Resolver Errores con Agente"
    needs: healthcheck-and-diagnose
    if: always() && (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'fix-me'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnosticar y Proponer Fix Automático
        run: |
          echo "Ejecutando pipeline de resolución automática para el issue #${{ github.event.issue.number }}..."
          # Aquí se enlaza con el bot OpenHands o el resolver automático configurado
