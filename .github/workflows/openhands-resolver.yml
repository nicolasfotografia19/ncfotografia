name: OpenHands Resolver

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número de Issue a resolver (ej. 1, 2, 3)"
        required: true
        default: "3"
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && (contains(github.event.issue.labels.*.name, 'fix-me') || contains(github.event.issue.body, '@openhands-agent') || contains(github.event.comment.body, '@openhands-agent')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenHands Resolver
        run: |
          python -m pip install --upgrade pip
          pip install "e2b==0.17.1" openhands-resolver

      - - name: Run OpenHands Resolver
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: "gemini/gemini-1.5-flash-latest"
          MODEL: "gemini/gemini-1.5-flash-latest"
          LITELLM_LOG: "DEBUG"
          run: |
          TARGET_ISSUE="${{ inputs.issue_number || github.event.issue.number }}"
          python -m openhands_resolver.resolve_issue --repo "${{ github.repository }}" --issue-number "$TARGET_ISSUE"
