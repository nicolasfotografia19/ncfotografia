name: OpenHands Resolver

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && (contains(github.event.issue.labels.*.name, 'fix-me') || contains(github.event.issue.body, '@openhands-agent') || contains(github.event.comment.body, '@openhands-agent')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenHands Resolver via Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: "gemini/gemini-1.5-pro"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          ISSUE_TO_RUN=${ISSUE_NUMBER:-1}
          docker run --rm \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e LLM_MODEL="$LLM_MODEL" \
            -v $(pwd):/workspace \
            ghcr.io/all-hands-ai/openhands-resolver:latest \
            python -m openhands_resolver.resolve_issue --issue-number "$ISSUE_TO_RUN" --repo-path /workspace
