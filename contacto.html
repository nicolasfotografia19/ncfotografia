<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sobre mí y contacto.">
  <meta name="theme-color" content="#0C0C0D">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <title>Sobre mí</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2026111701">
  <script src="/config.js?v=2026111701"></script>
  <script src="/plantilla.js?v=2026111701"></script>
</head>

<body data-page="sobreMi">
  <div class="grain" aria-hidden="true"></div>
  <div id="menu-contenedor"></div>

  <main class="container">
    <div id="tab-about">

      <header class="page-head">
        <span class="eyebrow reveal" data-cfg="sobreMi.etiqueta">Sobre mí</span>
        <h1 class="display reveal reveal--d1" data-cfg-titulo="sobreMi">Sobre mí</h1>
      </header>

      <div class="about">

        <figure class="about__photo reveal reveal--d1" id="about-photo">
          <img data-cfg-src="sobreMi.foto" data-cfg-alt="sobreMi.fotoAlt" alt="" width="1000" height="1333" decoding="async" fetchpriority="high">
          <figcaption data-cfg="sobreMi.fotoPie"></figcaption>
        </figure>

        <div class="about__main reveal reveal--d2">
          <blockquote class="h2"><em id="about-frase"></em></blockquote>

          <div class="prose mt-6" style="font-size: var(--fs-lead)" data-cfg-lista="sobreMi.parrafos"></div>

          <hr class="divider">

          <span class="label">Conexión directa</span>
          <div class="row mt-4">
            <a data-cfg-link="instagram" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>

            </a>
            <a data-cfg-link="email" class="icon-btn" aria-label="Email">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </a>
          </div>
        </div>

        <aside class="about__card reveal reveal--d3">
          <div class="card card--interactive">
            <span class="label" data-cfg="sobreMi.tarjetaEtiqueta"></span>
            <h2 class="h3" data-cfg-titulo="sobreMi" data-cfg-prefijo="tarjeta"></h2>
            <p class="muted" style="font-size: var(--fs-small)" data-cfg="sobreMi.tarjetaTexto"></p>

            <div class="stack" style="margin-top: var(--space-6)">
              <a data-cfg-link="email" class="btn btn--primary btn--block">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                Enviar email
              </a>
              <a data-cfg-link="whatsapp" target="_blank" rel="noopener noreferrer" class="btn btn--ghost btn--block">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Enviar WhatsApp
              </a>
              <a data-cfg-link="instagram" target="_blank" rel="noopener noreferrer" class="btn btn--ghost btn--block">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                Mensaje directo
              </a>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <footer id="pie"></footer>

  <script>
    // La frase lleva comillas tipográficas; sin foto, se quita el bloque
    document.getElementById('about-frase').textContent = SITE.sobreMi.frase ? '“' + SITE.sobreMi.frase + '”' : '';
    if (!SITE.sobreMi.foto) document.getElementById('about-photo').remove();
  </script>
  <script src="/proteccion.js?v=2026111701"></script>
</body>
</html>
