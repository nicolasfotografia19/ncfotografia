       GALERÍA / API INSTAGRAM
  ====================================================== -->

  <script>

    const IG_API_URL =
      'https://script.google.com/macros/s/AKfycbxBM4NG4tD2KjWuDO76ml20Ln96aKPKBYJBFT4ToKNwYNRQVuEVbniImYW_9GcSuaXA2Q/exec';


    let allPosts = [];


    /*
     * Cantidad de publicaciones que se agregan
     * en cada tanda.
     */

    const POSTS_PER_BATCH = 9;


    /*
     * Estado de la galería.
     */

    let currentPosts = [];

    let renderedCount = 0;

    let loadMoreObserver = null;


    // =====================================================
    // CARGAR GALERÍA DESDE LA API
    // =====================================================

    async function loadGallery() {

      const loading =
        document.getElementById('loading-indicator');

      const errorBox =
        document.getElementById('error-message');

      const errorText =
        document.getElementById('error-text');


      try {

        const response =
          await fetch(IG_API_URL);


        if (!response.ok) {

          throw new Error(
            'Error al conectar con el servidor.'
          );

        }


        allPosts =
          await response.json();


        if (allPosts.error) {

          throw new Error(allPosts.error);

        }


        loading.style.display = 'none';


        renderPosts(allPosts, true);


      } catch (err) {

        loading.style.display = 'none';


        errorText.textContent =
          'No se pudo sincronizar el feed: ' +
          err.message;


        errorBox.classList.remove('hidden');

      }

    }


    // =====================================================
    // RENDERIZAR GALERÍA POR TANDAS
    // =====================================================

    function renderPosts(posts, reset = true) {

      const container =
        document.getElementById('gallery-container');


      /*
       * Si es una nueva galería:
       * limpiar todo y comenzar desde cero.
       */

      if (reset) {

        container.innerHTML = '';

        currentPosts = posts;

        renderedCount = 0;


        /*
         * Desconectar observer anterior.
         */

        if (loadMoreObserver) {

          loadMoreObserver.disconnect();

          loadMoreObserver = null;

        }


        /*
         * Eliminar el trigger anterior,
         * si existiera.
         */

        const oldTrigger =
          document.getElementById(
            'load-more-trigger'
          );


        if (oldTrigger) {

          oldTrigger.remove();

        }

      }


      // ===================================================
      // SIN PUBLICACIONES
      // ===================================================

      if (currentPosts.length === 0) {

        container.innerHTML = `

          <div
            class="col-span-full text-center text-xs text-zinc-500 font-mono"
          >
            No hay publicaciones disponibles.
          </div>

        `;

        return;

      }


      // ===================================================
      // SIGUIENTE TANDA
      // ===================================================

      const nextPosts =
        currentPosts.slice(
          renderedCount,
          renderedCount + POSTS_PER_BATCH
        );


      nextPosts.forEach(
        (post, localIndex) => {

          const index =
            renderedCount + localIndex;


          /*
           * Imagen.
           *
           * Para videos usamos thumbnail.
           * Para imágenes usamos media_url.
           */

          const imgUrl =
            post.media_type === 'VIDEO'
              ? post.thumbnail_url
              : post.media_url;


          const caption =
            post.caption || '';


          // ===============================================
          // CONTENEDOR DE LA FOTO
          // ===============================================

          const item =
            document.createElement('div');


          item.className =
            'masonry-item relative group cursor-pointer overflow-hidden bg-[#08080a] border border-white/[0.08] rounded-sm';


          item.onclick =
            () => openLightbox(post);


          // ===============================================
          // IMAGEN
          // ===============================================

          const img =
            document.createElement('img');


          img.src =
            imgUrl;


          img.alt =
            caption
              ? caption.substring(0, 80)
              : 'Fotografía de Nicolás';


          /*
           * Las primeras dos imágenes:
           * carga inmediata y prioridad alta.
           */

          if (index < 2) {

            img.loading = 'eager';

            img.fetchPriority = 'high';

          } else {

            /*
             * Las demás:
             * carga diferida.
             */

            img.loading = 'lazy';

            img.fetchPriority = 'low';

          }


          /*
           * Decodificación asíncrona.
           */

          img.decoding = 'async';


          /*
           * Evitar arrastre accidental.
           */

          img.draggable = false;


          /*
           * Estilo de imagen.
           */

          img.className =
            'w-full h-auto object-cover opacity-85 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700 ease-out';


          // ===============================================
          // OVERLAY
          // ===============================================

          const overlay =
            document.createElement('div');


          overlay.className =
            'absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center backdrop-blur-[2px]';


          const overlayText =
            document.createElement('span');


          overlayText.className =
            'text-[9px] uppercase tracking-[0.25em] text-white font-mono font-medium';


          overlayText.textContent =
            'Ampliar';


          overlay.appendChild(
            overlayText
          );


          // ===============================================
          // INSERTAR FOTO
          // ===============================================

          item.appendChild(img);

          item.appendChild(overlay);

          container.appendChild(item);

        }
      );


      // ===================================================
      // ACTUALIZAR CONTADOR
      // ===================================================

      renderedCount +=
        nextPosts.length;


      // ===================================================
      // ¿QUEDAN MÁS FOTOS?
      // ===================================================

      if (
        renderedCount <
        currentPosts.length
      ) {

        let loadMoreTrigger =
          document.getElementById(
            'load-more-trigger'
          );


        /*
         * Crear el elemento que detectará
         * cuando el usuario se acerque al final.
         */

        if (!loadMoreTrigger) {

          loadMoreTrigger =
            document.createElement('div');


          loadMoreTrigger.id =
            'load-more-trigger';


          loadMoreTrigger.className =
            'w-full h-20 flex items-center justify-center';


          container.parentNode.insertBefore(
            loadMoreTrigger,
            container.nextSibling
          );

        }


        // ===============================================
        // INTERSECTION OBSERVER
        // ===============================================

        loadMoreObserver =
          new IntersectionObserver(

            (entries) => {

              if (
                entries[0].isIntersecting
              ) {

                loadMoreObserver.disconnect();

                renderPosts(
                  currentPosts,
                  false
                );

              }

            },

            {
              /*
               * Cargar la siguiente tanda
               * antes de llegar al final.
               */

              rootMargin:
                '800px 0px'

            }

          );


        loadMoreObserver.observe(
          loadMoreTrigger
        );


      } else {

        /*
         * No quedan más fotos.
         */

        const trigger =
          document.getElementById(
            'load-more-trigger'
          );


        if (trigger) {

          trigger.remove();

        }

      }

    }


    // =====================================================
    // FILTROS
    // =====================================================

    function filterPosts(category) {


      /*
       * Actualizar apariencia
       * de los botones.
       */

      document
        .querySelectorAll('.filter-btn')
        .forEach(btn => {


          if (
            btn.dataset.category === category
          ) {

            btn.className =
              'filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white border-b border-white';

          } else {

            btn.className =
              'filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white/40 hover:text-white';

          }

        });


      // ===================================================
      // TODAS
      // ===================================================

      if (category === 'Todas') {

        renderPosts(
          allPosts,
          true
        );

        return;

      }


      // ===================================================
      // FILTRAR POR CATEGORÍA
      // ===================================================

      const filtered =
        allPosts.filter(post => {

          const text =
            (post.caption || '')
              .toLowerCase();


          return text.includes(
            category.toLowerCase()
          );

        });


      /*
       * Reiniciar galería con los
       * resultados filtrados.
       */

      renderPosts(
        filtered,
        true
      );

    }


    // =====================================================
    // LIGHTBOX
    // =====================================================

    function openLightbox(post) {

      const lightbox =
        document.getElementById(
          'lightbox'
        );


      const mediaContainer =
        document.getElementById(
          'lightbox-media-container'
        );


      const captionEl =
        document.getElementById(
          'lightbox-caption'
        );


      const linkEl =
        document.getElementById(
          'lightbox-link'
        );


      const imgUrl =
        post.media_type === 'VIDEO'
          ? post.thumbnail_url
          : post.media_url;


      mediaContainer.innerHTML = `

        <img
          src="${imgUrl}"
          alt="Fotografía ampliada"
          class="max-h-[75vh] w-auto object-contain rounded-sm"
          decoding="async"
        />

      `;


      captionEl.textContent =
        post.caption ||
        'Sin descripción';


      linkEl.href =
        post.permalink;


      lightbox.classList.remove(
        'hidden'
      );


      lightbox.classList.add(
        'flex'
      );

    }


    // =====================================================
    // CERRAR LIGHTBOX
    // =====================================================

    function closeLightbox() {

      const lightbox =
        document.getElementById(
          'lightbox'
        );


      lightbox.classList.remove(
        'flex'
      );


      lightbox.classList.add(
        'hidden'
      );

    }


    // =====================================================
    // INICIAR
    // =====================================================

    document.addEventListener(
      'DOMContentLoaded',
      loadGallery
    );

  </script>
