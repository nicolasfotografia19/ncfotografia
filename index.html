<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nicolás Fotografía - Portafolio de fotografía editorial, arquitectura, retratos y estilo de vida. Mar del Plata, Argentina.">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <title>Nicolás Fotografía — Portafolio</title>

  <!-- Sentry SDK Oficial con DSN integrado -->
  <script src="https://js.sentry-cdn.com/77ca64b8b1ef19ae6322d6c94a717.min.js" crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #030305;
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(35, 35, 45, 0.45) 0%, transparent 60%);
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
    }
    .font-serif { font-family: 'Playfair Display', serif; }
    
    .masonry-grid { column-count: 1; column-gap: 2rem; }
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
    .masonry-item { break-inside: avoid; margin-bottom: 2rem; display: block; }

    /* Ajustes para evitar solapamientos visuales */
    main {
      position: relative;
      display: block;
    }
    #menu-contenedor, footer {
      position: relative;
      width: 100%;
      display: block;
      z-index: 20;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">
  <!-- Textura de fondo -->
  <div class="fixed inset-0 pointer-events-none z-50 opacity-[0.038] mix-blend-screen" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 256 256\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');"></div>

  <div id="menu-contenedor"></div>

  <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-10 md:px-12 md:py-16 relative z-10">
    <header class="mb-14 pb-8 border-b border-white/[0.08]">
      <div class="flex items-center gap-3 mb-3">
        <span class="inline-block w-6 h-[1px] bg-white/40"></span>
        <span class="text-[10px] uppercase tracking-[0.4em] text-zinc-400 font-mono">Diario Visual • Portafolio</span>
      </div>
      <h1 class="text-4xl md:text-5xl font-serif text-white mb-4 leading-tight font-light">Arquitectura, retratos y <span class="italic">atmósferas visuales.</span></h1>
      <p class="text-sm text-zinc-400 font-light max-w-2xl leading-relaxed">Una colección fotográfica pura basada en la luz natural, los contrastes honestos y la estética documental.</p>
      
      <!-- Filtros actualizados -->
      <div class="mt-8 flex flex-wrap gap-3" id="filter-buttons">
        <button onclick="filterPosts('Todas')" data-category="Todas" class="filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white border-b border-white">Todas</button>
        <button onclick="filterPosts('Arquitectura')" data-category="Arquitectura" class="filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white/40 hover:text-white">Arquitectura</button>
        <button onclick="filterPosts('Retratos')" data-category="Retratos" class="filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white/40 hover:text-white">Retratos</button>
        <button onclick="filterPosts('Estilo de vida')" data-category="Estilo de vida" class="filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white/40 hover:text-white">Estilo de vida</button>
      </div>
    </header>

    <div id="loading-indicator" class="text-center py-20 text-xs text-white/50 tracking-widest uppercase font-mono">Sincronizando galería...</div>
    <div id="error-message" class="hidden text-center py-20 text-red-400 text-xs font-mono"><span id="error-text"></span></div>
    
    <div id="gallery-container" class="masonry-grid relative pb-16"></div>
  </main>

  <!-- Lightbox para ver fotos en grande -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-[#030305]/95 backdrop-blur-xl flex-col items-center justify-center p-6">
    <button onclick="closeLightbox()" class="absolute top-8 right-8 text-white/70 hover:text-white p-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div id="lightbox-media-container" class="w-full max-w-5xl flex justify-center mt-8"></div>
    <div class="mt-6 text-center max-w-2xl w-full">
      <p id="lightbox-date" class="text-[10px] text-zinc-500 uppercase tracking-widest mb-3 font-mono"></p>
      <p id="lightbox-caption" class="text-sm text-zinc-300 font-light mb-4"></p>
      <a id="lightbox-link" href="#" target="_blank" class="inline-flex items-center gap-2 text-[10px] uppercase tracking-widest text-white border-b border-white/30 hover:border-white transition-all pb-1">Ver en Instagram</a>
    </div>
  </div>

  <script src="/fetch-menu.js"></script>

  <!-- Lógica integrada de tu propia API de Instagram -->
  <script>
    const IG_API_URL = 'https://script.google.com/macros/s/AKfycbxBM4NG4tD2KjWuDO76ml20Ln96aKPKBYJBFT4ToKNwYNRQVuEVbniImYW_9GcSuaXA2Q/exec';
    let allPosts = [];

    async function loadGallery() {
      const loading = document.getElementById('loading-indicator');
      const container = document.getElementById('gallery-container');
      const errorBox = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');

      try {
        const response = await fetch(IG_API_URL);
        if (!response.ok) throw new Error('Error al conectar con el servidor.');
        
        allPosts = await response.json();
        if (allPosts.error) throw new Error(allPosts.error);

        loading.style.display = 'none';
        renderPosts(allPosts);
      } catch (err) {
        loading.style.display = 'none';
        errorText.textContent = 'No se pudo sincronizar el feed: ' + err.message;
        errorBox.classList.remove('hidden');
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center text-xs text-zinc-500 font-mono">No hay publicaciones disponibles.</div>';
        return;
      }

      posts.forEach((post, index) => {
        const imgUrl = post.media_type === 'VIDEO' ? post.thumbnail_url : post.media_url;
        const caption = post.caption || '';
        
        const item = document.createElement('div');
        item.className = 'masonry-item relative group cursor-pointer overflow-hidden bg-[#08080a] border border-white/[0.08] rounded-sm';
        item.onclick = () => openLightbox(post);

        item.innerHTML = `
          <img src="${imgUrl}" alt="${caption.substring(0, 30)}" class="w-full h-auto object-cover opacity-85 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700 ease-out" loading="lazy">
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center backdrop-blur-[2px]">
            <span class="text-[9px] uppercase tracking-[0.25em] text-white font-mono font-medium">Ampliar</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Sistema de filtrado básico por palabras clave en el texto (caption) de Instagram
    function filterPosts(category) {
      // Actualizar estilos visuales de los botones
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.category === category) {
          btn.className = 'filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white border-b border-white';
        } else {
          btn.className = 'filter-btn text-[10px] uppercase tracking-[0.2em] px-4 py-2 font-medium transition-all text-white/40 hover:text-white';
        }
      });

      if (category === 'Todas') {
        renderPosts(allPosts);
        return;
      }

      const filtered = allPosts.filter(post => {
        const text = (post.caption || '').toLowerCase();
        return text.includes(category.toLowerCase());
      });

      renderPosts(filtered);
    }

    function openLightbox(post) {
      const lightbox = document.getElementById('lightbox');
      const mediaContainer = document.getElementById('lightbox-media-container');
      const captionEl = document.getElementById('lightbox-caption');
      const linkEl = document.getElementById('lightbox-link');
      
      const imgUrl = post.media_type === 'VIDEO' ? post.thumbnail_url : post.media_url;

      mediaContainer.innerHTML = `<img src="${imgUrl}" class="max-h-[75vh] w-auto object-contain rounded-sm" />`;
      captionEl.textContent = post.caption || 'Sin descripción';
      linkEl.href = post.permalink;

      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('flex');
      lightbox.classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', loadGallery);
  </script>

  <!-- Bloqueo de clic derecho -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
