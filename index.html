<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Nicolás Fotografía - Portafolio de fotografía editorial, arquitectura, retratos y estilo de vida. Mar del Plata, Argentina."
  >

  <link rel="icon" type="image/svg+xml" href="/logo.svg">

  <title>Nicolás Fotografía — Portafolio</title>


  <!-- =========================================================
       SENTRY
       Se carga después de que la página terminó de cargar.
       Esto evita que Sentry bloquee la carga inicial.
  ========================================================== -->

  <script>
    window.addEventListener('load', function () {
      const script = document.createElement('script');

      script.src =
        'https://browser.sentry-cdn.com/7.100.0/bundle.min.js';

      script.crossOrigin = 'anonymous';

      script.onload = function () {
        Sentry.init({
          dsn: "https://77ca64b8b1ef19ae6322d6c94a717@ncfotografia.sentry.io/ncfotografia-web",
          environment: "production",

          // Antes: 1.0
          // Ahora: 10% de las transacciones
          tracesSampleRate: 0.1
        });
      };

      document.head.appendChild(script);
    });
  </script>


  <!-- =========================================================
       TAILWIND
       Se mantiene por ahora para no romper tu diseño.
       
       IMPORTANTE:
       Más adelante podemos reemplazar el CDN por un CSS
       generado específicamente para tu página.
  ========================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =========================================================
       GOOGLE FONTS
  ========================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================================
       ESTILOS
  ========================================================== -->

  <style>

    body {
      background-color: #030305;

      background-image:
        radial-gradient(
          circle at 50% -10%,
          rgba(35, 35, 45, 0.45) 0%,
          transparent 60%
        );

      color: #f4f4f5;

      font-family: 'Inter', sans-serif;
    }


    .font-serif {
      font-family: 'Playfair Display', serif;
    }


    /* =======================================================
       MASONRY
    ======================================================== */

    .masonry-grid {
      column-count: 1;
      column-gap: 2rem;
    }

    @media (min-width: 640px) {
      .masonry-grid {
        column-count: 2;
      }
    }

    @media (min-width: 1024px) {
      .masonry-grid {
        column-count: 3;
      }
    }


    .masonry-item {
      break-inside: avoid;
      margin-bottom: 2rem;
      display: block;
    }


    /* =======================================================
       ESTRUCTURA
    ======================================================== */

    main {
      position: relative;
      display: block;
    }


    #menu-contenedor,
    footer {
      position: relative;
      width: 100%;
      display: block;
      z-index: 20;
    }

  </style>

</head>


<body class="min-h-screen flex flex-col relative">


  <!-- =========================================================
       TEXTURA DE FONDO
  ========================================================== -->

  <div
    class="fixed inset-0 pointer-events-none z-50 opacity-[0.038] mix-blend-screen"
    style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 256 256\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');">
  </div>


  <!-- =========================================================
       MENÚ
  ========================================================== -->

  <div id="menu-contenedor"></div>


  <!-- =========================================================
       CONTENIDO PRINCIPAL
  ========================================================== -->

  <main

  >

    <header class="mb-14 pb-8 border-b border-white/[0.08]">

      <div class="flex items-center gap-3 mb-3">

        <span
          class="inline-block w-6 h-[1px] bg-white/40">
        </span>

        <span
          class="text-[10px] uppercase tracking-[0.4em] text-zinc-400 font-mono"
        >
          Diario Visual • Portafolio
        </span>

      </div>
