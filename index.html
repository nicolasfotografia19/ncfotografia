<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Nicolás Fotografía - Portafolio de fotografía editorial, arquitectura, retratos y estilo de vida. Mar del Plata, Argentina.">

  <link rel="icon"
        type="image/svg+xml"
        href="/logo.svg">

  <title>Nicolás Fotografía — Portafolio</title>


  <!-- =====================================================
       SENTRY
       Se carga después de que la página termina de cargar
       ===================================================== -->

  <script>

    window.addEventListener('load', function () {

      var script =
        document.createElement('script');

      script.src =
        'https://browser.sentry-cdn.com/7.100.0/bundle.min.js';

      script.crossOrigin =
        'anonymous';

      script.onload = function () {

        Sentry.init({

          dsn:
            "https://77ca64b8b1ef19ae6322d6c94a717@ncfotografia.sentry.io/ncfotografia-web",

          environment:
            "production",

          tracesSampleRate:
            0.1

        });

      };

      document.head.appendChild(script);

    });

  </script>


  <!-- =====================================================
       TAILWIND
       ===================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =====================================================
       GOOGLE FONTS
       ===================================================== -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">


  <!-- =====================================================
       ESTILOS
       ===================================================== -->

  <style>

    body {

      background-color:
        #030305;

      background-image:
        radial-gradient(
          circle at 50% -10%,
          rgba(35, 35, 45, 0.45) 0%,
          transparent 60%
        );

      color:
        #f4f4f5;

      font-family:
        'Inter',
        sans-serif;

    }


    .font-serif {

      font-family:
        'Playfair Display',
        serif;

    }


    .masonry-grid {

      column-count:
        1;

      column-gap:
        2rem;

    }


    @media (min-width: 640px) {

      .masonry-grid {

        column-count:
          2;

      }

    }


    @media (min-width: 1024px) {

      .masonry-grid {

        column-count:
          3;

      }

    }


    .masonry-item {

      break-inside:
        avoid;

      margin-bottom:
        2rem;

      display:
        block;

    }


    main {

      position:
        relative;

      display:
        block;

    }


    #menu-contenedor,
    footer {

      position:
        relative;

      width:
        100%;

      display:
        block;

      z-index:
        20;

    }

  </style>

</head>


<body class="min-h-screen flex flex-col relative">


  <!-- =====================================================
       TEXTURA DE FONDO
       ===================================================== -->

  <div
    class="fixed inset-0 pointer-events-none z-50 opacity-[0.038] mix-blend-screen"
    style="background-image: url('data:image/svg+xml,...noise...');">
  </div>


  <!-- =====================================================
       MENÚ
       ===================================================== -->

  <div id="menu-contenedor"></div>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main
    class="flex-1 w-full max-w-7xl mx-auto px-6 py-10 md:px-12 md:py-16 relative z-10">


    <header
      class="mb-14 pb-8 border-b border-white/[0.08]">


      <div>

        <!-- Acá permanece el contenido original de tu encabezado -->

      </div>


      <!-- =================================================
           FILTROS
           ================================================= -->

      <div
        class="mt-8 flex flex-wrap gap-3"
        id="filter-buttons">

        <button
          onclick="filterPosts('Todas')"
          data-category="Todas"
          class="...">

          Todas

        </button>


        <button
          onclick="filterPosts('Arquitectura')"
          data-category="Arquitectura"
          class="...">

          Arquitectura

        </button>


        <button
          onclick="filterPosts('Retratos')"
          data-category="Retratos"
          class="...">

          Retratos

        </button>


        <button
          onclick="filterPosts('Estilo de vida')"
          data-category="Estilo de vida"
          class="...">

          Estilo de vida

        </button>

      </div>

    </header>


    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
      id="loading-indicator"
      class="text-center text-xs text-zinc-500 font-mono py-20">

      Sincronizando galería...

    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
      id="error-message"
      class="hidden text-center text-xs text-red-400 font-mono py-20">

      <span id="error-text"></span>

    </div>


    <!-- =====================================================
         GALERÍA
         ===================================================== -->

    <div
      id="gallery-container"
      class="masonry-grid relative pb-16">
    </div>


  </main>


  <!-- =====================================================
       LIGHTBOX
       ===================================================== -->

  <div
    id="lightbox"
    class="hidden fixed inset-0 z-50 items-center justify-center bg-black/95 p-4">


    <button
      onclick="closeLightbox()"
      class="absolute top-6 right-6 text-white/70 hover:text-white text-2xl z-50">

      ×

    </button>


    <div
      class="w-full max-w-6xl flex flex-col items-center">


      <div
        id="lightbox-media-container"
        class="flex items-center justify-center w-full">
      </div>


      <p
        id="lightbox-date"
        class="text-xs text-zinc-500 font-mono mt-4">
      </p>


      <p
        id="lightbox-caption"
        class="text-sm text-zinc-300 mt-2 text-center max-w-2xl">
      </p>


      <a
        id="lightbox-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="mt-4 text-xs text-zinc-400 hover:text-white">

        Ver en Instagram

      </a>

    </div>

  </div>


  <!-- =====================================================
       MENÚ EXTERNO
       ===================================================== -->

  <script src="/fetch-menu.js"></script>


  <!-- =====================================================
       JAVASCRIPT PRINCIPAL
       ===================================================== -->

  <script>

    const IG_API_URL =
      'https://script.google.com/macros/s/AKfycbxBM4NG4tD2KjWuDO76ml20Ln96aKPKBYJBFT4ToNWYNRQVuEVbniImYW_9GcSuaXA2Q/exec';


    const POSTS_PER_BATCH =
      9;


    let allPosts =
      [];

    let currentPosts =
      [];

    let renderedCount =
      0;

    let loadMoreObserver =
      null;


    /* =====================================================
       CARGAR GALERÍA
       ===================================================== */

    async function loadGallery() {

  const loading =
    document.getElementById('loading-indicator');

  const errorBox =
    document.getElementById('error-message');

  const errorText =
    document.getElementById('error-text');

  try {

    loading.textContent =
      'Sincronizando galería...';

    const response =
      await fetch(IG_API_URL);

    if (!response.ok) {

      throw new Error(
        `El servidor respondió con error HTTP ${response.status}.`
      );

    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {

      throw new Error(
        'La API no devolvió una lista de fotografías.'
      );

    }

    allPosts =
      data;

    loading.style.display =
      'none';

    renderPosts(
      allPosts,
      true
    );

  } catch (err) {

    loading.style.display =
      'none';

    errorText.textContent =
      'No se pudo sincronizar el feed: ' +
      err.message;

    errorBox.classList.remove(
      'hidden'
    );

  }

}

    /* =====================================================
       FILTROS
       ===================================================== */

    function filterPosts(
      category
    ) {

      const buttons =
        document.querySelectorAll(
          '#filter-buttons button'
        );


      buttons.forEach(
        button => {

          if (
            button.dataset.category ===
            category
          ) {

            button.classList.add(
              'bg-white',
              'text-black'
            );

            button.classList.remove(
              'text-zinc-400'
            );

          } else {

            button.classList.remove(
              'bg-white',
              'text-black'
            );

            button.classList.add(
              'text-zinc-400'
            );

          }

        }
      );


      if (
        category === 'Todas'
      ) {

        renderPosts(
          allPosts,
          true
        );

        return;

      }


      const filtered =
        allPosts.filter(
          post => {

            const caption =
              (
                post.caption ||
                ''
              ).toLowerCase();


            return caption.includes(
              category.toLowerCase()
            );

          }
        );


      renderPosts(
        filtered,
        true
      );

    }


    /* =====================================================
       LIGHTBOX
       ===================================================== */

    function openLightbox(
      post
    ) {

      const lightbox =
        document.getElementById(
          'lightbox'
        );


      const mediaContainer =
        document.getElementById(
          'lightbox-media-container'
        );


      const captionEl =
        document.getElementById(
          'lightbox-caption'
        );


      const linkEl =
        document.getElementById(
          'lightbox-link'
        );


      const imgUrl =
        post.media_type === 'VIDEO'
          ? post.thumbnail_url
          : post.media_url;


      mediaContainer.innerHTML = `

        <img
          src="${imgUrl}"
          class="max-h-[75vh] w-auto object-contain rounded-sm"
          alt="Fotografía">

      `;


      captionEl.textContent =
        post.caption ||
        'Sin descripción';


      linkEl.href =
        post.permalink;


      lightbox.classList.remove(
        'hidden'
      );


      lightbox.classList.add(
        'flex'
      );

    }


    function closeLightbox() {

      const lightbox =
        document.getElementById(
          'lightbox'
        );


      lightbox.classList.add(
        'hidden'
      );


      lightbox.classList.remove(
        'flex'
      );


      document.getElementById(
        'lightbox-media-container'
      ).innerHTML =
        '';

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    loadGallery();


    /* =====================================================
       CERRAR LIGHTBOX CON ESC
       ===================================================== */

    document.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Escape'
        ) {

          closeLightbox();

        }

      }
    );


    /* =====================================================
       DESACTIVAR MENÚ CONTEXTUAL
       ===================================================== */

    document.addEventListener(
      'contextmenu',
      function (e) {

        e.preventDefault();

      }
    );

  </script>

</body>

</html>
